[build-system]
requires      = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "fluxpy"
version     = "0.1.0"
description = "A toolbox with utilities for metabolic modelling analysis"
authors     = [{ name="Haris Zafeiropoulos", email="haris.zafeiropoulos@kuleuven.be" }]
readme      = "README.md"
dependencies = [
  "plotly>=5.22.0,<6.0.0",
  "seaborn>=0.13.2,<1.0.0",
  "numpy>=1.26.4,<2.0.0",
  "pandas>=2.2.2,<3.0.0",
  "scipy>=1.13.0,<2.0.0",
  "mergem==1.1.0",
  "cobra==0.29.0",
  "networkx==2.8.8",
  "dash>=2.17.0,<3.0.0",
  "dash-cytoscape>=1.0.1,<2.0.0",
  "ndex2>=3.9.0,<4.0.0"
]
requires-python = ">=3.9,<4.0"

[project.optional-dependencies]
jupyter = ["ipykernel>=6.29.5,<7.0.0"]

